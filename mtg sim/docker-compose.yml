services:
  sim:
    build:
      context: .
      args:
        FORGE_VERSION: ${FORGE_VERSION:-2.0.15}   # set FORGE_VERSION=x.y.z in .env and rebuild to update Forge
    container_name: starshard-sim
    restart: unless-stopped
    # Host networking so the sim can reach the Star Shard API, which only
    # listens on the NAS's own loopback (127.0.0.1:4001). The sim itself also
    # binds to loopback only; the DSM reverse proxy is the only way in.
    network_mode: host
    env_file: .env              # SIM_USERS, SIM_ADMINS, ANTHROPIC_API_KEY, optional SIM_RUNS_PER_DAY / SIM_ASKS_PER_DAY / SIM_DAILY_BUDGET / SIM_TARGET / SIM_EXTRA (never committed)
    environment:
      - HOST=127.0.0.1
      - PORT=8088
      - STARSHARD_API=http://127.0.0.1:4001
      - FORGE_XMX=1536m         # per Forge process; a game uses ~700 MB
      - SIM_PARALLEL=3          # Forge processes at once (the NAS has 8 threads; a game mostly uses one)
      - MAX_GAMES=200
    volumes:
      - ./data:/data
    cpu_shares: 512             # half the default priority, so staging.starshard.net stays responsive (this NAS kernel cannot do hard cpu limits)
    mem_limit: 7g               # three Forge processes at 1.5 GB plus Node
