<!-- @dsCard group="Colors" viewport="700x160" subtitle="The rare-pull sub-ramp — three values, card context only" name="Foil" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}*{box-sizing:border-box}
body{background:var(--surface);color:var(--ink);font-family:var(--font-body);padding:16px}
.lbl{font-family:var(--font-retro);font-size:var(--text-2xs);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--ink-muted)}
</style></head><body>
<div style="display:flex;gap:16px;align-items:center">
<div style="display:flex;gap:8px">
<div style="border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light)"><div style="width:88px;height:48px;background:var(--foil-surface)"></div><div style="background:var(--white);padding:5px 6px;font-family:var(--font-retro);font-size:10px;color:var(--teal-900)">foil-surface</div></div><div style="border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light)"><div style="width:88px;height:48px;background:var(--foil-sunken)"></div><div style="background:var(--white);padding:5px 6px;font-family:var(--font-retro);font-size:10px;color:var(--teal-900)">foil-sunken</div></div><div style="border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light)"><div style="width:88px;height:48px;background:var(--foil-edge)"></div><div style="background:var(--white);padding:5px 6px;font-family:var(--font-retro);font-size:10px;color:var(--teal-900)">foil-edge</div></div>
</div>
<div data-context="card" data-foil style="width:96px;aspect-ratio:1080/1920;background:var(--surface);border:2px solid var(--foil-edge);border-radius:var(--radius-card);padding:9px 8px;display:flex;flex-direction:column;gap:4px">
<div style="font-family:var(--font-retro);font-size:8px;letter-spacing:.18em;color:var(--foil-edge)">XVII OF XXVIII</div>
<div style="flex:1;background:var(--surface-sunken);border:1px solid var(--foil-edge);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--foil-edge)">☾</div>
<div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--foil-edge);text-align:right;line-height:.9">XVII</div>
</div>
<div style="flex:1;font-size:12.5px;color:var(--ink-muted);line-height:1.55">The only sanctioned extension to the 12-value ramp. Swaps surface, sunken and edge; inherits ink from card context. <b>TarotCard[rare] only</b> — never a page surface, never text on light.</div>
</div>
</body></html>
