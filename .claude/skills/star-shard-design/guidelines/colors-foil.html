<!-- @dsCard group="Colors" viewport="700x220" subtitle="Retired — glow is the current enhancement layer" name="No foil, use glow" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--bg-outer);color:var(--ink);font-family:var(--font-body);padding:20px;box-sizing:border-box;font-size:13px;line-height:1.6}
h1{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 10px;color:var(--ink)}
.tag{display:inline-block;font-size:10px;color:#E8A87C;border:1px solid #E8A87C;padding:2px 8px;margin-bottom:10px}
.row{display:flex;gap:16px;margin-top:14px}
.box{width:120px;height:70px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-muted);border:1px solid rgba(240,216,154,.2)}
.glow{box-shadow:0 0 14px rgba(240,216,154,.25);border-color:#F0D89A;color:#F0D89A}
.glow-strong{box-shadow:0 0 20px rgba(255,176,0,.3);border-color:#FFB000;color:#FFB000}
</style></head><body>
<div class="tag">retired in v2.0</div>
<h1>no foil/rare treatment</h1>
<p>v1.0's `TarotCard[rare]` gold-foil sub-ramp is gone along with the
tarot-card framing itself. Emphasis is now a soft colored glow instead
— a wide, low-opacity box-shadow, never a second surface color.</p>
<div class="row">
  <div class="box">plain panel</div>
  <div class="box glow">parchment glow</div>
  <div class="box glow-strong">amber glow — tonight only</div>
</div>
</body></html>
