<!-- @dsCard group="Spacing" viewport="700x220" subtitle="padding 64/32/140 — the calm-pass law" name="Screen padding" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--bg-outer);font-family:var(--font-body);padding:16px;box-sizing:border-box;font-size:12.5px;color:#9A8A5E;line-height:1.6}
.frame{width:220px;height:160px;margin:0 auto;background:radial-gradient(120% 60% at 50% 0%,#1E1706 0%,#0F0B03 55%,#080502 100%);position:relative;border:1px solid rgba(240,216,154,.15)}
.top{position:absolute;top:0;left:0;right:0;height:26px;border-bottom:1px dashed rgba(240,216,154,.3);font-size:9px;color:#F0D89A;text-align:center;line-height:26px}
.side{position:absolute;top:26px;bottom:56px;left:0;width:13px;border-right:1px dashed rgba(240,216,154,.3)}
.bottom{position:absolute;bottom:0;left:0;right:0;height:56px;border-top:1px dashed rgba(240,216,154,.3);font-size:9px;color:#F0D89A;text-align:center;line-height:56px}
</style></head><body>
<div class="frame">
  <div class="top">64px top</div>
  <div class="side"></div>
  <div class="bottom">140px bottom (clears tab bar/scroll)</div>
</div>
<div style="text-align:center;margin-top:10px">~32-34px horizontal margins · tap-min 44px never smaller</div>
</body></html>
