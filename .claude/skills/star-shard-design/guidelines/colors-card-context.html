<!-- @dsCard group="Colors" viewport="700x180" subtitle="data-context="card" inverts the roles" name="Card context" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-body);padding:16px;box-sizing:border-box}
*{box-sizing:border-box}
.lbl{font-family:var(--font-retro);font-size:var(--text-2xs);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--ink-muted)}
</style></head><body>
<div data-context="card" style="background:var(--surface);padding:16px;border:1px solid #2A5450">
<div class="lbl" style="color:var(--teal-200)">ⅸ of xxviii</div>
<div style="font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--ink);margin-top:4px">Al-Ṭarf</div>
<div style="color:var(--ink-accent);font-size:13px">"the glance"</div>
<div style="display:flex;gap:8px;margin-top:12px">
<div style="flex:1"><div style="height:30px;background:#102828;border:1px solid #2A5450"></div><div style="font-family:var(--font-retro);font-size:9px;color:var(--teal-200);margin-top:4px">surface</div></div><div style="flex:1"><div style="height:30px;background:#1A3A38;border:1px solid #2A5450"></div><div style="font-family:var(--font-retro);font-size:9px;color:var(--teal-200);margin-top:4px">surface-raised</div></div><div style="flex:1"><div style="height:30px;background:#F8F8F0;border:1px solid #2A5450"></div><div style="font-family:var(--font-retro);font-size:9px;color:var(--teal-200);margin-top:4px">ink</div></div><div style="flex:1"><div style="height:30px;background:#A8E0DC;border:1px solid #2A5450"></div><div style="font-family:var(--font-retro);font-size:9px;color:var(--teal-200);margin-top:4px">ink-muted</div></div><div style="flex:1"><div style="height:30px;background:#38C0B8;border:1px solid #2A5450"></div><div style="font-family:var(--font-retro);font-size:9px;color:var(--teal-200);margin-top:4px">accent</div></div><div style="flex:1"><div style="height:30px;background:#F8F0C8;border:1px solid #2A5450"></div><div style="font-family:var(--font-retro);font-size:9px;color:var(--teal-200);margin-top:4px">ink-warn</div></div>
</div></div>
</body></html>
