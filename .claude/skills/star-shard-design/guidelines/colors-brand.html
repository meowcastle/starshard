<!-- @dsCard group="Colors" viewport="700x170" subtitle="Five values, read directly out of the live code" name="The palette" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--bg-outer);color:var(--ink);font-family:var(--font-body);padding:16px;box-sizing:border-box}
*{box-sizing:border-box}
.sw{border:1px solid var(--border)}
.sw .fill{height:44px}
.sw .lbl{background:#0A0603;padding:5px 6px;font-family:var(--font-body);font-size:10px;line-height:1.4;color:var(--ink)}
.sw b{display:block;font-weight:600}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
<div class="sw"><div class="fill" style="background:#040302"></div><div class="lbl"><b>bg-outer</b>#040302</div></div>
<div class="sw"><div class="fill" style="background:#F2EAD6"></div><div class="lbl"><b>ink</b>#F2EAD6</div></div>
<div class="sw"><div class="fill" style="background:#9A8A5E"></div><div class="lbl"><b>ink-muted</b>#9A8A5E</div></div>
<div class="sw"><div class="fill" style="background:#F0D89A"></div><div class="lbl"><b>parchment</b>#F0D89A</div></div>
<div class="sw"><div class="fill" style="background:#FFB000"></div><div class="lbl"><b>amber</b>#FFB000 — tonight only</div></div>
</div>
</body></html>
