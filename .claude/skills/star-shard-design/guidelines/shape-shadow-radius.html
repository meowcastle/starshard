<!-- @dsCard group="Shape" viewport="700x220" subtitle="Sharp by default, glow instead of offset shadow" name="Radius & shadow" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--bg-outer);color:var(--ink);font-family:var(--font-body);padding:20px;box-sizing:border-box}
.row{display:flex;gap:16px;align-items:flex-end}
.box{width:90px;height:70px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9A8A5E;border:1px solid rgba(240,216,154,.25)}
.lbl{font-size:10px;color:#9A8A5E;text-align:center;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="border-radius:0">0</div><div class="lbl">radius-none — default</div></div>
  <div class="col"><div class="box" style="border-radius:50%">☾</div><div class="lbl">radius-round — rings, dots</div></div>
  <div class="col"><div class="box" style="border-radius:6px">6px</div><div class="lbl">radius-soft — small panels</div></div>
  <div class="col"><div class="box" style="border-radius:14px;box-shadow:0 0 14px rgba(240,216,154,.25);border-color:#F0D89A;color:#F0D89A">14px</div><div class="lbl">radius-card + glow — the occasional minigame card</div></div>
</div>
</body></html>
