<!-- @dsCard group="Shape" viewport="700x180" subtitle="Hard offsets, no blur ever" name="Shadow & radius" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-body);padding:16px;box-sizing:border-box}
*{box-sizing:border-box}
.lbl{font-family:var(--font-retro);font-size:var(--text-2xs);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--ink-muted)}
</style></head><body>
<div style="display:flex;gap:14px;flex-wrap:wrap">
<div><div style="width:120px;height:52px;background:var(--surface-raised);border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light);box-shadow:4px 4px 0 rgba(16,40,40,.45)"></div><div class="lbl" style="margin-top:8px">shadow-window</div></div><div><div style="width:120px;height:52px;background:var(--surface-raised);border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light);box-shadow:3px 3px 0 rgba(16,40,40,.35)"></div><div class="lbl" style="margin-top:8px">shadow-raised</div></div><div><div style="width:120px;height:52px;background:var(--surface-raised);border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light);box-shadow:2px 2px 0 rgba(16,40,40,.30)"></div><div class="lbl" style="margin-top:8px">shadow-chip</div></div>
<div style="width:2px;background:var(--teal-200);margin:0 4px"></div>
<div><div style="display:flex;gap:8px;align-items:flex-end">
<div style="width:52px;height:52px;background:var(--accent);border-radius:0"></div>
<div style="width:52px;height:52px;background:var(--accent);border-radius:50%"></div>
<div style="width:36px;height:52px;background:var(--teal-900);border-radius:16px"></div>
</div><div class="lbl" style="margin-top:8px">0 · round 50% · card 16px</div>
<div style="font-size:12px;color:var(--ink-muted)">radius is 0 unless it is physically round or physically a card</div></div>
</div>
</body></html>
