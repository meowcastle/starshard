<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--bg-outer);color:var(--ink);padding:20px;box-sizing:border-box}
.sample{margin-bottom:20px}
.lbl{font-family:var(--font-body);font-size:11px;color:#9A8A5E;margin-bottom:4px}
.display{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:#F2EAD6}
.body{font-family:'Varela Round',sans-serif;font-size:14.5px;color:#F2EAD6}
</style></head><body>
<div class="sample"><div class="lbl">display — Cormorant Garamond, weight 600. headings, titles, names.</div><div class="display">the empty district</div></div>
<div class="sample"><div class="lbl">body — Varela Round. everything else: body copy, labels, buttons, inputs.</div><div class="body">the moon rests here tonight — a quiet night, and a productive one.</div></div>
</body></html>
