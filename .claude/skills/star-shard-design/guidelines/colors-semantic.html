<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-body);padding:16px;box-sizing:border-box}
*{box-sizing:border-box}
.lbl{font-family:var(--font-retro);font-size:var(--text-2xs);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--ink-muted)}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div><div style="height:52px;background:var(--surface);border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light)"></div><div class="lbl" style="margin-top:6px">surface</div><div style="font-size:12px;color:var(--ink-muted)">ink on it</div></div><div><div style="height:52px;background:var(--surface-raised);border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light)"></div><div class="lbl" style="margin-top:6px">surface-raised</div><div style="font-size:12px;color:var(--ink-muted)">cards, windows</div></div><div><div style="height:52px;background:var(--surface-sunken);border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light)"></div><div class="lbl" style="margin-top:6px">surface-sunken</div><div style="font-size:12px;color:var(--ink-muted)">wells, code</div></div><div><div style="height:52px;background:var(--backdrop);border:2px solid;border-color:var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light)"></div><div class="lbl" style="margin-top:6px">backdrop</div><div style="font-size:12px;color:var(--ink-muted)">behind windows</div></div>
</div>
</body></html>
