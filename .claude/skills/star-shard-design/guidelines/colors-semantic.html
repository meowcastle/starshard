<!-- @dsCard group="Colors" viewport="700x220" subtitle="Named roles, not raw hex" name="Semantic tokens" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--bg-outer);color:var(--ink);font-family:var(--font-body);padding:16px;box-sizing:border-box;font-size:12px}
table{border-collapse:collapse;width:100%}
td{padding:6px 10px;border-bottom:1px solid rgba(240,216,154,.15)}
td:first-child{color:#F0D89A;font-family:monospace}
.chip{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:8px;border:1px solid rgba(240,216,154,.3)}
</style></head><body>
<table>
<tr><td>--bg-outer</td><td><span class="chip" style="background:#040302"></span>#040302 — page fill</td></tr>
<tr><td>--bg-top / --bg-mid / --bg-bottom</td><td><span class="chip" style="background:#1E1706"></span>#1E1706 → #0F0B03 → #080502 — screen gradient</td></tr>
<tr><td>--ink</td><td><span class="chip" style="background:#F2EAD6"></span>#F2EAD6 — primary text</td></tr>
<tr><td>--ink-muted</td><td><span class="chip" style="background:#9A8A5E"></span>#9A8A5E — secondary/meta text</td></tr>
<tr><td>--parchment</td><td><span class="chip" style="background:#F0D89A"></span>#F0D89A — accent, everything else</td></tr>
<tr><td>--amber</td><td><span class="chip" style="background:#FFB000"></span>#FFB000 — tonight only</td></tr>
<tr><td>--error</td><td><span class="chip" style="background:#E8A87C"></span>#E8A87C — the only status color</td></tr>
</table>
</body></html>
