<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,#1E1706 0%,#0F0B03 55%,#080502 100%);padding:24px;box-sizing:border-box;font-family:var(--font-body)}
.title{font-family:var(--font-display);font-weight:600;font-size:24px;color:#F2EAD6;margin-bottom:6px}
.body{font-size:13.5px;color:#F2EAD6;line-height:1.6;margin-bottom:10px}
.meta{font-size:11px;color:#9A8A5E}
.hi{font-size:13.5px;color:#FFFDF5}
</style></head><body>
<div class="meta">tonight · 21 january</div>
<div class="title">the moon rests in the empty district</div>
<div class="body">a quiet night, and a productive one — good for building and harvesting, gently.</div>
<div class="hi">rare, high-emphasis text only — #FFFDF5</div>
</body></html>
